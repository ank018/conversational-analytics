- id: q007
  question: What is the average delivery time in days?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT avg(date_diff('day', order_purchase_timestamp,
                         order_delivered_customer_date)) AS avg_days
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL
  tags: [average, dates, delivery]
  rules: [delivery_definition]
  traps: []
  notes: >
    Expect 12.50. Four other intervals are constructible from the five date
    columns; purchase-to-customer is the definition in the semantics doc.
    Undelivered orders are excluded rather than counted as infinitely late.
  verified: true

- id: q008
  question: What proportion of delivered orders arrived by the estimated date?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT avg(CASE WHEN order_delivered_customer_date
                      <= order_estimated_delivery_date
               THEN 1.0 ELSE 0.0 END) AS on_time_rate
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL
  tags: [rate, dates, delivery]
  rules: [delivery_definition]
  traps: []
  notes: Expect 0.92.
  verified: true

- id: q009
  question: How many orders were placed in each month of 2017?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT strftime(order_purchase_timestamp, '%Y-%m') AS month,
           count(*) AS orders
    FROM orders
    WHERE order_status NOT IN ('canceled', 'unavailable')
      AND order_purchase_timestamp >= DATE '2017-01-01'
      AND order_purchase_timestamp <  DATE '2018-01-01'
    GROUP BY 1
    ORDER BY 1
  tags: [group_by, time_series, orders]
  rules: [status_exclusion]
  traps: []
  notes: >
    Twelve rows. November peaks - Black Friday. 2017 is chosen deliberately
    because it is the only complete year.

    SCORING CORRECTED at stage 10. `ordered` was true, but the question
    does not ask for an ordering - the rows are labelled, so comparing them
    as a set is the right semantics and gold's ORDER BY is presentation.
    Found because q302 flipped between two runs of byte-identical SQL: with
    no ORDER BY, DuckDB returned the two rows in whichever order the
    execution produced, and the verdict followed the coin. The SQL is
    unchanged; only what counts as a matching result has changed.
  verified: true

- id: q010
  question: Which state do the most customers come from?
  kind: answerable
  tier: 2
  ordered: true
  answer_columns: 1
  sql: |
    SELECT c.customer_state, count(DISTINCT c.customer_unique_id) AS customers
    FROM customers c
    JOIN orders o ON o.customer_id = c.customer_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
    GROUP BY 1
    ORDER BY 2 DESC
    LIMIT 1
  tags: [group_by, customers, geography, ranking]
  rules: [customer_id_vs_unique, status_exclusion]
  traps: []
  notes: >
    Expect SP with 39,749. Two rules apply: count customer_unique_id rather
    than customer_id, and exclude cancelled and unavailable orders. Omitting
    the status filter gives 40,302 - SP still wins, so the ranking is right
    and the number is wrong, which is the harder failure to notice.
  verified: true

