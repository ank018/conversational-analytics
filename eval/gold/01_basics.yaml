# Gold batch 01 - basics
#
# Tier 1 and 2. Single table or one join, straightforward aggregation.
# These exist to establish a floor: a system that fails these is not working
# at all, and the accuracy curve needs a region where everything succeeds.
#
# Set `verified: true` only after you have read the SQL, agreed it answers
# the question as asked, and seen the result the verifier prints.

- id: q001
  question: How many orders have been placed in total?
  kind: answerable
  tier: 1
  ordered: false
  sql: |
    SELECT count(*) AS orders
    FROM orders
    WHERE order_status NOT IN ('canceled', 'unavailable')
  tags: [count, orders]
  rules: [status_exclusion]
  traps: []
  notes: >
    Expect 98,207. The unfiltered count is 99,441; the difference is the
    exclusion rule from docs/data_semantics.md 2.2. A model that omits the
    filter is wrong by 1.24%.
  verified: true

