- id: q311
  question: What is the average physical length of a product in centimetres?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT avg(product_length_cm) AS avg_length_cm
    FROM products
  tags: [average, products]
  rules: []
  traps: [column_confusion]
  notes: >
    Expect 30.82 cm. The trap is product_name_lenght - misspelled in the
    source data, and it holds the character count of the product name, not a
    physical dimension.

    Measured: product_name_lenght averages 48.48. An earlier version of this
    note claimed the two differ by an order of magnitude, which was asserted
    rather than measured and was wrong - the ratio is 1.6. That makes the trap
    considerably better than first described: a model reaching for the wrong
    column returns "48.5 cm", which is an entirely plausible parcel dimension.
    Nothing about the wrong answer looks wrong.
  verified: true

- id: q312
  question: Which payment method has the highest average payment value?
  kind: answerable
  tier: 2
  ordered: true
  sql: |
    SELECT payment_type, avg(payment_value) AS avg_value
    FROM order_payments
    GROUP BY 1
    ORDER BY 2 DESC
    LIMIT 1
  tags: [payments, average, ranking]
  rules: []
  traps: []
  notes: Aggregated from payments alone, without touching order_items.
  verified: true

- id: q313
  question: How many orders were paid in more than one instalment?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT count(DISTINCT order_id) AS orders_with_instalments
    FROM order_payments
    WHERE payment_installments > 1
  tags: [count, payments]
  rules: []
  traps: []
  notes: >
    DISTINCT matters - an order can carry several payment rows. Two rows
    record zero instalments and are excluded by the filter.
  verified: true

- id: q314
  question: How many orders were placed by customers in Rio de Janeiro state?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT count(*) AS orders
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND c.customer_state = 'RJ'
  tags: [count, geography]
  rules: [status_exclusion]
  traps: [geolocation_fanout]
  notes: State code is RJ. customer_state is already on customers.
  verified: true

- id: q315
  question: What is the total freight charged across all orders?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT sum(oi.freight_value) AS total_freight
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
  tags: [sum, freight]
  rules: [status_exclusion]
  traps: []
  notes: >
    Freight is charged per item line, not per order. This is a total, not an
    average, so no order-level aggregation is needed.
  verified: true

