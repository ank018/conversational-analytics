- id: q318
  question: What is the total value of all payments received?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT sum(payment_value) AS total_paid
    FROM order_payments
  tags: [sum, payments]
  rules: []
  traps: [payment_fanout]
  notes: >
    Expect 16,008,872.12. This is deliberately NOT revenue - it includes
    freight, and it includes payments on cancelled orders. Joining order_items
    to answer it inflates the figure. The semantics doc records that revenue
    and total paid differ by roughly 18% and that this is correct.
  verified: true

- id: q319
  question: How much revenue came from customers in the city of Sao Paulo?
  kind: answerable
  tier: 3
  ordered: false
  sql: |
    SELECT sum(oi.price) AS revenue
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND c.customer_city = 'sao paulo'
  tags: [revenue, geography]
  rules: [status_exclusion, freight_definition]
  traps: [geolocation_fanout]
  notes: >
    City, not state - the counterpart to q108. customer_city is lowercase and
    unaccented in this data. The geolocation table also carries a city column
    and joining to it multiplies the answer by roughly 150.
  verified: true

- id: q320
  question: What is the average item price in the health and beauty category?
  kind: answerable
  tier: 3
  ordered: false
  sql: |
    SELECT avg(oi.price) AS avg_item_price
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    JOIN products p ON p.product_id = oi.product_id
    JOIN product_category_translation t
      ON t.product_category_name = p.product_category_name
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
      AND t.product_category_name_english = 'health_beauty'
  tags: [average, products, category]
  rules: [status_exclusion]
  traps: [category_inner_join]
  notes: >
    An inner join to the translation table is correct here, because the
    question names a category that must be translated. This is the case where
    the LEFT join rule does NOT apply - included so the rule is not learned as
    "always use LEFT".
  verified: true