# Gold batch 04 - operations, delivery, reviews, products
#
# Mostly tier 2 and 3. Moves the set away from revenue, which batch 02 covers
# heavily, and into delivery, reviews and the product catalogue.
#
# Introduces two trap tags not in docs/data_semantics.md section 4:
#   column_confusion - two similarly named columns measuring different things
#   review_fanout    - joining reviews through order_items counts a review
#                      once per item rather than once per order
# Both need adding to the semantics doc before this batch is final.

- id: q301
  question: How many orders were delivered later than the estimated date?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT count(*) AS late_orders
    FROM orders
    WHERE order_status = 'delivered'
      AND order_delivered_customer_date IS NOT NULL
      AND order_delivered_customer_date > order_estimated_delivery_date
  tags: [count, delivery, dates]
  rules: [delivery_definition]
  traps: []
  notes: >
    The complement of q008's on-time rate. Undelivered orders are excluded
    rather than treated as infinitely late.
  verified: true

- id: q302
  question: Do orders delivered late receive lower review scores?
  kind: answerable
  tier: 4
  ordered: true
  sql: |
    SELECT CASE WHEN o.order_delivered_customer_date
                     > o.order_estimated_delivery_date
                THEN 'late' ELSE 'on_time' END AS delivery,
           avg(r.review_score) AS avg_score,
           count(*) AS reviews
    FROM orders o
    JOIN order_reviews r ON r.order_id = o.order_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY 1
    ORDER BY 1
  tags: [reviews, delivery, comparison]
  rules: [delivery_definition]
  traps: []
  notes: >
    Two rows. Reviews join to orders one-to-one here, so no fan-out - but 768
    orders carry no review and drop out of the inner join. That is acceptable
    for a comparison of means; it would not be for a count.
  verified: true

- id: q303
  question: Which state has the longest average delivery time?
  kind: answerable
  tier: 3
  ordered: true
  sql: |
    SELECT c.customer_state,
           avg(date_diff('day', o.order_purchase_timestamp,
                         o.order_delivered_customer_date)) AS avg_days
    FROM orders o
    JOIN customers c ON c.customer_id = o.customer_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
    GROUP BY 1
    ORDER BY 2 DESC
    LIMIT 1
  tags: [delivery, geography, ranking]
  rules: [delivery_definition]
  traps: [geolocation_fanout]
  notes: >
    customer_state is on the customers table. Expect a northern state - the
    distance from the Sao Paulo seller base is large.
  verified: true

- id: q304
  question: How many one-star reviews came from orders that were delivered late?
  kind: answerable
  tier: 3
  ordered: false
  sql: |
    SELECT count(*) AS late_one_star
    FROM orders o
    JOIN order_reviews r ON r.order_id = o.order_id
    WHERE o.order_status = 'delivered'
      AND o.order_delivered_customer_date IS NOT NULL
      AND o.order_delivered_customer_date > o.order_estimated_delivery_date
      AND r.review_score = 1
  tags: [count, reviews, delivery]
  rules: [delivery_definition]
  traps: []
  notes: Counts review rows, not distinct orders. Both are defensible; rows is the convention from the semantics doc.
  verified: true

- id: q305
  question: What is the average freight cost per order?
  kind: answerable
  tier: 3
  ordered: false
  sql: |
    SELECT avg(order_freight) AS avg_freight_per_order
    FROM (
      SELECT o.order_id, sum(oi.freight_value) AS order_freight
      FROM orders o
      JOIN order_items oi ON oi.order_id = o.order_id
      WHERE o.order_status NOT IN ('canceled', 'unavailable')
      GROUP BY 1
    )
  tags: [average, freight, cte]
  rules: [status_exclusion]
  traps: [aov_item_vs_order]
  notes: >
    Same shape as q103. Averaging freight_value directly gives average freight
    per item, which is lower and answers a different question.
  verified: true

- id: q307
  question: How many distinct products have been sold at least once?
  kind: answerable
  tier: 2
  ordered: false
  sql: |
    SELECT count(DISTINCT oi.product_id) AS products_sold
    FROM order_items oi
    JOIN orders o ON o.order_id = oi.order_id
    WHERE o.order_status NOT IN ('canceled', 'unavailable')
  tags: [count, products]
  rules: [status_exclusion]
  traps: []
  notes: Lower than the 32,951 products in the catalogue.
  verified: true

- id: q308
  question: How many sellers have never completed a sale?
  kind: answerable
  tier: 3
  ordered: false
  sql: |
    SELECT count(*) AS sellers_without_sales
    FROM sellers s
    WHERE NOT EXISTS (
      SELECT 1
      FROM order_items oi
      JOIN orders o ON o.order_id = oi.order_id
      WHERE oi.seller_id = s.seller_id
        AND o.order_status NOT IN ('canceled', 'unavailable')
    )
  tags: [count, sellers, anti_join]
  rules: [status_exclusion]
  traps: []
  notes: >
    An anti-join. A model reaching for a LEFT JOIN with an IS NULL filter is
    equally correct; one using an inner join cannot answer this at all.
  verified: true

