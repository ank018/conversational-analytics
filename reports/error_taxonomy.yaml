# Stage 7 - error taxonomy
# Built from baseline_deepseek_20260818T114153Z.json
# Model: deepseek/deepseek-v4-pro-0813
#
# Fill in `cause:` for every entry. `suggested_cause` is a pattern
# match on the SQL, not a judgement - read the two queries before
# accepting it.
#
# Valid causes:
#   missing_status_filter      Did not exclude cancelled/unavailable orders
#   wrong_revenue_metric       Used payment_value or included freight as revenue
#   wrong_customer_key         Counted customer_id instead of customer_unique_id
#   wrong_aggregation_level    Averaged item rows where the order was the unit
#   wrong_date_column          Filtered on the wrong one of the five date columns
#   wrong_join_type            Inner join where LEFT was needed, or the reverse
#   fanout                     A join multiplied rows and inflated an aggregate
#   missing_distinct           Counted item rows where the question asked for orders
#   wrong_column               Picked a similarly named column measuring something else
#   wrong_granularity          Grouped by year where months were asked for, or similar
#   missing_threshold          Ignored a minimum stated in the question
#   shape_mismatch             Right idea, wrong number of rows or columns
#   sql_error                  Query did not parse or bind
#   empty_or_truncated         Model returned nothing, or ran out of tokens
#   defensible_disagreement    Model's answer is reasonable; gold encodes our choice
#   gold_wrong                 Gold answer is incorrect and must be fixed
#   unclear                    Cause not obvious from the SQL
#
# Use defensible_disagreement when the model's answer is reasonable
# and gold encodes a choice. Use gold_wrong when gold is incorrect -
# those questions must then be fixed in eval/gold/.

