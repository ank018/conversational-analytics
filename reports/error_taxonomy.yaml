  notes: ''
  gold_sql: "WITH monthly AS (\n  SELECT strftime(o.order_purchase_timestamp, '%Y-%m') AS\
    \ month,\n         sum(oi.price) AS revenue\n  FROM order_items oi\n  JOIN orders o ON\
    \ o.order_id = oi.order_id\n  WHERE o.order_status NOT IN ('canceled', 'unavailable')\n\
    \    AND o.order_purchase_timestamp >= DATE '2017-01-01'\n    AND o.order_purchase_timestamp\
    \ <  DATE '2018-01-01'\n  GROUP BY 1\n)\nSELECT month,\n       revenue,\n       revenue\
    \ / lag(revenue) OVER (ORDER BY month) - 1 AS growth\nFROM monthly\nORDER BY month"
  model_sql: "WITH monthly_revenue AS (\n  SELECT \n    DATE_TRUNC('month', o.order_purchase_timestamp)\
