- id: q609
  tier: 3
  verdict: wrong_value
  question: What was revenue in the last complete month of data?
  detail: 'row 0 col 0: gold 848860.1000000255 vs 4439.54'
  rules:
  - partial_years
  - status_exclusion
  - freight_definition
  traps: []
  suggested_cause: missing_status_filter
  cause: defensible_disagreement
  notes: ''
  gold_sql: "SELECT sum(oi.price) AS revenue\nFROM order_items oi\nJOIN orders o ON o.order_id\
    \ = oi.order_id\nWHERE o.order_status NOT IN ('canceled', 'unavailable')\n  AND o.order_purchase_timestamp\
    \ >= DATE '2018-08-01'\n  AND o.order_purchase_timestamp <  DATE '2018-09-01'"
  model_sql: "WITH max_ts AS (\n  SELECT MAX(order_purchase_timestamp) AS max_timestamp FROM\
    \ orders\n),\nlast_complete_month_start AS (\n  SELECT \n    CASE \n      WHEN max_timestamp::DATE\
    \ = (DATE_TRUNC('month', max_timestamp) + INTERVAL '1 month' - INTERVAL '1 day')::DATE\n\
    \      THEN DATE_TRUNC('month', max_timestamp)\n      ELSE DATE_TRUNC('month', max_timestamp)\
    \ - INTERVAL '1 month'\n    END AS month_start\n  FROM max_ts\n)\nSELECT SUM(op.payment_value)\
    \ AS revenue\nFROM order_payments op\nJOIN orders o ON op.order_id = o.order_id\nJOIN\
    \ last_complete_month_start lcms ON o.order_purchase_timestamp >= lcms.month_start \n\
    \  AND o.order_purchase_timestamp < lcms.month_start + INTERVAL '1 month';"

