- id: q402
  tier: 4
  verdict: wrong_value
  question: What share of revenue comes from customers who ordered more than once?
  detail: 'row 0 col 0: gold 0.055615394448353075 vs 0.0'
  rules:
  - customer_id_vs_unique
  - status_exclusion
  traps: []
  suggested_cause: missing_status_filter
  cause: wrong_revenue_metric
  notes: ''
  gold_sql: "WITH repeat_customers AS (\n  SELECT c.customer_unique_id\n  FROM customers c\n\
    \  JOIN orders o ON o.customer_id = c.customer_id\n  WHERE o.order_status NOT IN ('canceled',\
    \ 'unavailable')\n  GROUP BY 1\n  HAVING count(DISTINCT o.order_id) > 1\n)\nSELECT sum(CASE\
    \ WHEN rc.customer_unique_id IS NOT NULL THEN oi.price ELSE 0 END)\n       / sum(oi.price)\
    \ AS repeat_revenue_share\nFROM order_items oi\nJOIN orders o ON o.order_id = oi.order_id\n\
    JOIN customers c ON c.customer_id = o.customer_id\nLEFT JOIN repeat_customers rc\n  ON\
    \ rc.customer_unique_id = c.customer_unique_id\nWHERE o.order_status NOT IN ('canceled',\
    \ 'unavailable')"
  model_sql: "WITH order_rev AS (\n  SELECT o.order_id, o.customer_id, COALESCE(SUM(op.payment_value),\
    \ 0) AS revenue\n  FROM orders o\n  LEFT JOIN order_payments op ON o.order_id = op.order_id\n\
    \  GROUP BY o.order_id, o.customer_id\n),\ncustomer_stats AS (\n  SELECT customer_id,\
    \ COUNT(*) AS order_count, SUM(revenue) AS revenue\n  FROM order_rev\n  GROUP BY customer_id\n\
    )\nSELECT SUM(CASE WHEN order_count > 1 THEN revenue ELSE 0 END) / SUM(revenue) AS share\n\
    FROM customer_stats;"

